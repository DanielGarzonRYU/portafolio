<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calculadora de Notas</title>
  <style>
    :root { --acento: #1d4e89; --texto: #16202e; --suave: #556274; --borde: #dde2e9; --fondo: #f6f7f9; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--fondo); color: var(--texto); }
    header { background: var(--acento); color: #fff; padding: 20px 16px; }
    header h1 { margin: 0; font-size: 20px; }
    header p { margin: 4px 0 0; opacity: .85; font-size: 14px; }
    main { padding: 16px; max-width: 480px; margin: 0 auto; }
    .corte { display: grid; grid-template-columns: 1fr 90px 70px; gap: 8px; align-items: center; background: #fff; border: 1px solid var(--borde); border-radius: 10px; padding: 12px; margin-bottom: 10px; }
    .corte label { font-weight: 600; font-size: 15px; }
    input { width: 100%; padding: 10px; border: 1px solid var(--borde); border-radius: 8px; font-size: 16px; text-align: center; }
    input:focus { outline: 2px solid var(--acento); border-color: transparent; }
    .pct { position: relative; }
    .pct input { padding-right: 20px; }
    .pct::after { content: "%"; position: absolute; right: 8px; top: 50%; transform: translateY(-50%); color: var(--suave); font-size: 14px; }
    .cab { display: grid; grid-template-columns: 1fr 90px 70px; gap: 8px; font-size: 12px; color: var(--suave); padding: 0 12px 6px; }
    .resultado { background: #fff; border: 1px solid var(--borde); border-radius: 10px; padding: 18px; text-align: center; margin-top: 16px; }
    .resultado .nota { font-size: 44px; font-weight: 700; }
    .resultado .msg { font-size: 15px; margin-top: 6px; }
    .ok { color: #1f7a4d; } .mal { color: #b42318; } .info { color: var(--acento); }
    .config { margin-top: 16px; font-size: 14px; color: var(--suave); display: flex; gap: 8px; align-items: center; justify-content: center; }
    .config input { width: 70px; padding: 6px; font-size: 14px; }
  </style>
</head>
<body>
  <header>
    <h1>Calculadora de Notas</h1>
    <p>Escala de 0 a 5 · deja vacío el corte que aún no tienes</p>
  </header>
  <main>
    <div class="cab"><span>Corte</span><span>Nota</span><span>Peso</span></div>
    <div id="cortes"></div>
    <div class="config">Nota mínima para aprobar: <input id="minima" type="number" step="0.1" min="0" max="5" value="3.0"></div>
    <div class="resultado" id="resultado"></div>
  </main>
  <script>
    const cortes = [
      { nombre: "Primer corte", peso: 30 },
      { nombre: "Segundo corte", peso: 30 },
      { nombre: "Tercer corte", peso: 40 },
    ];
    const caja = document.getElementById("cortes");
    caja.innerHTML = cortes.map((c, i) => `
      <div class="corte">
        <label for="n${i}">${c.nombre}</label>
        <input id="n${i}" type="number" inputmode="decimal" step="0.1" min="0" max="5" placeholder="—">
        <div class="pct"><input id="p${i}" type="number" min="0" max="100" value="${c.peso}" aria-label="Peso del ${c.nombre}"></div>
      </div>`).join("");

    function calcular() {
      const minima = parseFloat(document.getElementById("minima").value) || 3;
      let acumulado = 0, pesoPendiente = 0, pesoTotal = 0;
      cortes.forEach((_, i) => {
        const nota = document.getElementById("n" + i).value;
        const peso = (parseFloat(document.getElementById("p" + i).value) || 0) / 100;
        pesoTotal += peso;
        if (nota === "") pesoPendiente += peso;
        else acumulado += Math.min(5, Math.max(0, parseFloat(nota))) * peso;
      });
      const r = document.getElementById("resultado");
      if (Math.abs(pesoTotal - 1) > 0.001) {
        r.innerHTML = `<div class="msg mal">Los pesos suman ${Math.round(pesoTotal * 100)} %. Deben sumar 100 %.</div>`;
        return;
      }
      if (pesoPendiente === 0) {
        const aprobo = acumulado >= minima - 1e-9;
        r.innerHTML = `<div>Nota definitiva</div><div class="nota ${aprobo ? "ok" : "mal"}">${acumulado.toFixed(2)}</div>
          <div class="msg ${aprobo ? "ok" : "mal"}">${aprobo ? "¡Aprobaste la materia!" : "No alcanzaste la nota mínima."}</div>`;
        return;
      }
      const necesaria = (minima - acumulado) / pesoPendiente;
      let msg;
      if (necesaria <= 0) msg = `<span class="ok">Ya aprobaste, aunque saques 0 en lo que falta.</span>`;
      else if (necesaria > 5) msg = `<span class="mal">Necesitarías ${necesaria.toFixed(2)}: ya no es posible aprobar.</span>`;
      else msg = `<span class="info">Necesitas en promedio <strong>${necesaria.toFixed(2)}</strong> en lo que falta para aprobar.</span>`;
      r.innerHTML = `<div>Llevas acumulado</div><div class="nota">${acumulado.toFixed(2)}</div><div class="msg">${msg}</div>`;
    }
    document.addEventListener("input", calcular);
    calcular();
  </script>
</body>
</html>
